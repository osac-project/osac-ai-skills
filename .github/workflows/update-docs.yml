name: Update Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'

# Default token is empty; the job grants only what create-pull-request needs.
permissions: {}

concurrency:
  group: update-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push docs branch / create PR
      pull-requests: write  # open auto-update-docs PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # create-pull-request pushes auto-update-docs

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Regenerate documentation
        run: make docs

      - name: Create Pull Request
        # Needs repo setting: Allow GitHub Actions to create and approve pull requests.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-regenerate skill catalog"
          title: "docs: auto-regenerate skill catalog"
          body: |
            This PR was automatically generated to update the GitHub Pages skill catalog.

            Regenerated docs/index.html from skills/ via make docs.
          branch: auto-update-docs
          delete-branch: true
          add-paths: |
            docs/
