// OSAC demo guest DNS -- BIND authoritative server for the two lab zones.
//
// Installed by setup-demo-named.sh as /etc/named/osac-demo-named.conf on
// demo-hv-01 and started by the osac-demo-named.service unit:
//
//   /usr/sbin/named -u named -c /etc/named/osac-demo-named.conf
//
// Listeners:
//   127.0.0.54:53     replaces the dnsmasq listener; the libvirt network
//                     forwarders (<forwarder domain="<zone>" addr="127.0.0.54"/>)
//                     keep working unchanged.
//   192.0.2.10:53     the hypervisor's management address. The AAP job
//                     pods reach any hypervisor address through the lab
//                     bridge gateway, and this address is not on a
//                     libvirt bridge: libvirt's bind-dynamic dnsmasq
//                     claims port 53 on EVERY address added to its
//                     bridges, so a bridge address cannot serve named.
//                     Both labs use this one listener; their per-lab TSIG
//                     keys keep the zones separate.
//
// 127.0.0.54 must exist on lo (named binds only assigned addresses); the
// bridges helper adds it and the osac-demo-named-bridges.service unit
// re-adds it at boot.

options {
    directory "/var/named";
    pid-file "/run/named/osac-demo-named.pid";
    session-keyfile "/run/named/osac-demo-session.key";

    listen-on port 53 { 127.0.0.54; 192.0.2.10; };
    listen-on-v6 { none; };

    // Authoritative-only for the two demo zones. Anything else forwarded
    // here (for example stale forwarders left in older network XML) is
    // refused instead of resolved.
    recursion no;
    // No root hints and no validation: stops the managed-keys priming
    // queries an authoritative-only server can never complete.
    dnssec-validation no;
    allow-query { any; };
    allow-query-cache { none; };

    // The readiness wait in the OSAC jobs sends unsigned queries; keep
    // answers minimal and do not leak the auth section.
    minimal-responses yes;
};

// No rndc channel for this instance. systemd stop (SIGTERM) flushes
// the zone journals into the zone files.
controls { };

// TSIG keys, generated on the hypervisor by setup-demo-named.sh with
// tsig-keygen.
// One key per lab zone: the hub cluster of one lab can never update the
// other lab's zone. Named reads them from /etc/named/osac-demo-keys/:
// the SELinux policy confines named to the standard /etc/named tree, so
// keys under /data (unlabeled_t parents) cannot be read by the service.
include "/etc/named/osac-demo-keys/osac-full-lab.key";
include "/etc/named/osac-demo-keys/osac-full2-lab.key";

zone "full.guests.osac.test" {
    type primary;
    file "dynamic/full.guests.osac.test.db";
    // The OSAC driver only creates and deletes A/AAAA records below the
    // zone (api.<order>, api-int.<order>, *.apps.<order>); the key cannot
    // touch SOA/NS or other record types.
    update-policy { grant osac-full-lab subdomain full.guests.osac.test. A AAAA; };
};

zone "full2.guests.osac.test" {
    type primary;
    file "dynamic/full2.guests.osac.test.db";
    update-policy { grant osac-full2-lab subdomain full2.guests.osac.test. A AAAA; };
};
